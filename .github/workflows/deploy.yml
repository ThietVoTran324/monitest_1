name: Deploy Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Catch empty-DB migrate regressions (ENUM double-create, etc.) before image ships.
  migrate-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moni
          POSTGRES_PASSWORD: moni
          POSTGRES_DB: moni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moni -d moni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install --upgrade pip && pip install .
      - name: Alembic upgrade head (empty DB)
        env:
          APP_ENV: test
          APP_BASE_URL: http://127.0.0.1:8010
          API_PUBLIC_URL: http://127.0.0.1:8010
          DATABASE_URL: postgresql+asyncpg://moni:moni@127.0.0.1:5432/moni
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          JWT_SECRET: ci_migrate_smoke_jwt_secret_32chars_min
        run: |
          alembic upgrade head
          alembic current | tee /tmp/alembic_current.txt
          grep -q "d3e4f5a6b7c8" /tmp/alembic_current.txt

  build-and-push:
    runs-on: ubuntu-latest
    needs: migrate-smoke
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires lowercase repository path (owner may have mixed case).
      - name: Lowercase image names
        id: image
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend_name=${OWNER_LC}/moni-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_name=${OWNER_LC}/moni-frontend" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          case "${OWNER_LC}" in
            *[[:upper:]]*) echo "owner still has uppercase after normalize" >&2; exit 1 ;;
          esac

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.backend_name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.backend_name }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.frontend_name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.frontend_name }}:latest

      - name: Export image tags
        id: meta
        run: |
          echo "backend_image=${{ env.REGISTRY }}/${{ steps.image.outputs.backend_name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${{ steps.image.outputs.frontend_name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.backend_name }}:${{ github.sha }}"
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.frontend_name }}:${{ github.sha }}"

  # Enable only after smoke on pinvps01: set repo variable ENABLE_PROD_DEPLOY=true
  # and secrets VPS_HOST / VPS_USER / VPS_SSH_KEY / GHCR_USERNAME / GHCR_TOKEN.
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.ENABLE_PROD_DEPLOY == 'true' }}
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY GHCR_USERNAME GHCR_TOKEN; do
            eval "val=\${$name}"
            if [ -z "${val}" ]; then
              echo "Missing secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "Deploy target host is configured (value redacted)."

      - name: Deploy over SSH (atomic script)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script_path: deploy/deploy_release.sh
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
