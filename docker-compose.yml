# Local deps (Postgres + Redis). App runs outside containers in local-process mode.
# See docs/Planing_docs/moni/RUNTIME_MODES.md
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moni
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: moni
    ports:
      - "5432:5432"
    volumes:
      - moni_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moni -d moni"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - moni_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  moni_pgdata:
  moni_redisdata:
